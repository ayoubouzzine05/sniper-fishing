name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'i18n/**'
      - 'messages/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'next.config.mjs'
      - 'middleware.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web-for-android.mjs'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static web bundle for Android
        run: node scripts/build-web-for-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sniper-fishing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
